backend:
  name: git-gateway
  branch: main # Change to 'master' if your GitHub repo uses master

media_folder: "images/uploads" 
public_folder: "/images/uploads"

collections:
  - name: "weekly_drop"
    label: "Weekly Drops"
    folder: "drops" 
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Post Title (e.g., Week 4: Summer Vibes)", name: "title", widget: "string"}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Brand Promoted", name: "brand", widget: "string"}
      - {label: "Models Featured", name: "models", widget: "string"}
      - {label: "Short Description", name: "body", widget: "text", required: false}